<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text-Dialog Entwurf</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Caveat:wght@500;700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#111; --cream:#FFF4D6; --paper:#FFFBEF; --white:#fff;
  --yellow:#FFD23F; --blue:#7AD7F0; --green:#B8F2A0; --purple:#E0B3FF; --coral:#FF6B6B;
  --muted:#4A4636; --line:#e8dcb8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ink:#EDE8DE; --cream:#1A1815; --paper:#211F1B; --white:#2C2924; --muted:#C4BBA9; --line:#3a352c; }
}
:root[data-theme="dark"]{ --ink:#EDE8DE; --cream:#1A1815; --paper:#211F1B; --white:#2C2924; --muted:#C4BBA9; --line:#3a352c; }
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,sans-serif;}
.stage{min-height:100vh;display:flex;align-items:flex-end;justify-content:center;padding:24px 16px 0;
  background:repeating-linear-gradient(var(--cream) 0 39px,var(--line) 39px 40px);}
.sheet{width:100%;max-width:760px;background:var(--paper);border:3px solid var(--ink);border-bottom:0;
  border-radius:28px 28px 0 0;box-shadow:0 -6px 0 0 var(--ink) inset, 6px -6px 0 var(--ink);padding:10px 20px 0;position:relative}
.grab{width:56px;height:6px;border-radius:3px;background:var(--ink);opacity:.25;margin:4px auto 12px}
h1{font-size:22px;font-weight:900;margin:0 0 14px;display:flex;align-items:center;gap:10px}
h1 .tag{font-size:12px;font-weight:800;background:var(--yellow);color:#111;border:2px solid var(--ink);border-radius:999px;padding:2px 10px}

/* bold box */
.bold{border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);background:var(--white)}
.preview{position:relative;height:210px;overflow:hidden;
  background:#FFFDF6 repeating-linear-gradient(transparent 0 31px,#c9e3f5 31px 32px);display:flex;align-items:center;justify-content:center;padding:16px}
.preview::before{content:"";position:absolute;left:46px;top:0;bottom:0;width:2px;background:#f3a0a0}
.preview .lbl{position:absolute;top:8px;right:10px;font-size:11px;font-weight:800;color:#111;background:var(--yellow);border:2px solid #111;border-radius:999px;padding:1px 8px}
#pv{max-width:86%;color:#111;white-space:pre-wrap;transition:all .15s;padding:6px 10px;border-radius:10px}
#pv ul,#pv ol{margin:0;padding-left:1.3em}
.wavy{text-decoration:underline wavy;text-underline-offset:5px}
.dbl{text-decoration:underline double;text-underline-offset:5px}
.single{text-decoration:underline;text-underline-offset:5px}

.input{margin-top:16px;padding:12px 14px}
textarea{width:100%;border:0;outline:0;resize:none;font:600 17px Inter;background:transparent;color:var(--ink);min-height:54px}
.symbols{display:flex;gap:6px;overflow-x:auto;padding-top:8px;border-top:2px dashed var(--line);scrollbar-width:none}
.symbols button{flex:0 0 auto;min-width:38px;height:38px;border:2px solid var(--ink);border-radius:10px;background:var(--cream);font:800 17px Inter;color:var(--ink);cursor:pointer}
.symbols button:active{transform:translate(2px,2px)}

.sec-title{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;margin:22px 2px 10px;display:flex;justify-content:space-between;align-items:center}
.sec-title a{font-size:12px;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:800;text-decoration:underline}
.presets{display:flex;gap:12px;overflow-x:auto;padding:2px 6px 10px 2px;scrollbar-width:none}
.preset{flex:0 0 auto;width:132px;height:92px;border:3px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);
  background:#FFFDF6;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;padding:10px;color:#111;text-align:left;font-family:Inter}
.preset.on{outline:4px solid var(--yellow);outline-offset:2px;transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.preset .s{font-size:11px;font-weight:800;opacity:.6}
.preset.add{background:var(--yellow);align-items:center;justify-content:center;font-weight:900;gap:2px}
.preset.add b{font-size:28px;line-height:1}

.tabs{display:flex;gap:8px;margin-top:6px;position:sticky;top:0;background:var(--paper);padding:8px 0;z-index:2}
.tab{flex:1;height:48px;border:3px solid var(--ink);border-radius:14px;background:var(--white);font:800 14px Inter;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.tab.on{background:var(--ink);color:var(--paper)}
.panel{display:none;padding:6px 2px 8px}
.panel.on{display:block}
.row{display:flex;align-items:center;gap:10px;margin:14px 0;flex-wrap:wrap}
.row > label{width:100%;font-size:12px;font-weight:800;color:var(--muted)}
.seg{display:inline-flex;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--white)}
.seg button{border:0;border-right:2px solid var(--ink);background:transparent;min-width:52px;height:46px;padding:0 12px;font:700 15px Inter;color:var(--ink);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--yellow);color:#111}
.chip{height:46px;padding:0 16px;border:3px solid var(--ink);border-radius:14px;background:var(--white);font:800 15px Inter;color:var(--ink);cursor:pointer}
.chip.on{background:var(--yellow);color:#111;box-shadow:3px 3px 0 var(--ink)}
.fonts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.font{height:64px;border:3px solid var(--ink);border-radius:14px;background:var(--white);color:var(--ink);cursor:pointer;font-size:22px}
.font small{display:block;font:700 11px Inter;opacity:.6}
.font.on{background:var(--yellow);color:#111;box-shadow:3px 3px 0 var(--ink)}
.slider{display:flex;align-items:center;gap:12px;width:100%}
input[type=range]{flex:1;accent-color:#111;height:28px}
.val{min-width:54px;text-align:center;font-weight:900;border:2px solid var(--ink);border-radius:10px;padding:4px 6px;background:var(--white)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);cursor:pointer;position:relative}
.sw.on::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;text-shadow:0 0 3px #000}
.sw.none{background:repeating-linear-gradient(45deg,#fff 0 6px,#eee 6px 12px)}
.sw.none.on::after{color:#111;text-shadow:none}
.sw.more{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.boxes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.box{height:70px;border:3px solid var(--ink);border-radius:14px;background:var(--white);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:800 11px Inter;color:var(--ink)}
.box i{display:block;width:34px;height:20px}
.box.on{background:var(--yellow);color:#111;box-shadow:3px 3px 0 var(--ink)}
.rot{display:flex;align-items:center;gap:10px;width:100%}
.dial{width:46px;height:46px;border:3px solid var(--ink);border-radius:50%;position:relative;background:var(--white);flex:0 0 auto}
.dial::after{content:"";position:absolute;left:50%;top:5px;width:3px;height:16px;background:var(--ink);transform-origin:50% 15px;transform:translateX(-50%) rotate(var(--r,0deg))}

.footer{position:sticky;bottom:0;background:var(--paper);display:flex;gap:10px;align-items:center;padding:14px 0 18px;border-top:2px solid var(--line);margin-top:10px}
.footer .ghost{height:52px;padding:0 16px;border:0;background:transparent;font:800 15px Inter;color:var(--ink);cursor:pointer}
.footer .del{color:var(--coral)}
.footer .save{margin-left:auto;height:56px;padding:0 30px;border:3px solid var(--ink);border-radius:16px;background:var(--yellow);box-shadow:5px 5px 0 var(--ink);font:900 17px Inter;color:#111;cursor:pointer}
.footer .save:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.remember{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.remember input{width:20px;height:20px;accent-color:#111}
@media (max-width:520px){ .fonts{grid-template-columns:repeat(2,1fr)} .boxes{grid-template-columns:repeat(2,1fr)} .tab span.t{display:none} .preset{width:116px} }
</style>
</head>
<body>
<div class="stage">
<div class="sheet">
  <div class="grab"></div>
  <h1>Neuer Text <span class="tag">Entwurf · klickbar</span></h1>

  <div class="bold preview"><span class="lbl">Vorschau</span><div id="pv"></div></div>

  <div class="bold input">
    <textarea id="txt">Photosynthese
Licht + CO₂ + H₂O → Glucose + O₂</textarea>
    <div class="symbols" id="sym"></div>
  </div>

  <div class="sec-title">Vorlagen <a href="#" onclick="return false">Bearbeiten</a></div>
  <div class="presets" id="presets"></div>

  <div class="tabs">
    <button class="tab on" data-t="schrift">Aa <span class="t">Schrift</span></button>
    <button class="tab" data-t="farbe">🎨 <span class="t">Farbe</span></button>
    <button class="tab" data-t="layout">☰ <span class="t">Layout</span></button>
    <button class="tab" data-t="rahmen">▢ <span class="t">Rahmen</span></button>
  </div>

  <div class="panel on" id="p-schrift">
    <div class="row"><label>Schriftart</label>
      <div class="fonts">
        <button class="font on" data-f="normal" style="font-family:Inter">Aa<small>Normal</small></button>
        <button class="font" data-f="cursive" style="font-family:'Dancing Script'">Aa<small>Schreibschrift</small></button>
        <button class="font" data-f="hand" style="font-family:Caveat;font-size:26px">Aa<small>Handschrift</small></button>
      </div></div>
    <div class="row"><label>Art</label>
      <div class="seg" id="kind">
        <button data-k="h1">Titel</button><button data-k="h2">Untertitel</button><button class="on" data-k="body">Text</button><button data-k="note">Fußnote</button>
      </div>
      <button class="chip" id="bold"><b>B</b> Fett</button>
    </div>
    <div class="row"><label>Größe</label>
      <div class="slider"><span style="font-size:13px">A</span><input type="range" id="size" min="12" max="72" value="26"><span style="font-size:24px;font-weight:800">A</span><span class="val" id="sizev">26</span></div></div>
    <div class="row"><label>Linie unter dem Text</label>
      <div class="seg" id="ul">
        <button class="on" data-u="">Keine</button><button data-u="single"><u>Einfach</u></button><button data-u="dbl"><span class="dbl">Doppelt</span></button><button data-u="wavy"><span class="wavy">Welle</span></button>
      </div></div>
  </div>

  <div class="panel" id="p-farbe">
    <div class="row"><label>Textfarbe</label><div class="swatches" id="tc"></div></div>
    <div class="row"><label>Textmarker</label><div class="swatches" id="hl"></div></div>
  </div>

  <div class="panel" id="p-layout">
    <div class="row"><label>Ausrichtung</label>
      <div class="seg" id="al"><button class="on" data-a="left">⬅︎ Links</button><button data-a="center">↔︎ Mitte</button><button data-a="right">Rechts ➡︎</button></div></div>
    <div class="row"><label>Liste</label>
      <div class="seg" id="li"><button class="on" data-l="">Keine</button><button data-l="•">•</button><button data-l="1.">1.</button><button data-l="a)">a)</button><button data-l="☐">☐</button></div></div>
    <div class="row"><label>Zeilenabstand</label>
      <div class="slider"><input type="range" id="lh" min="10" max="25" value="13"><span class="val" id="lhv">1,3</span></div></div>
    <div class="row"><label>Drehen</label>
      <div class="rot"><div class="dial" id="dial"></div><input type="range" id="rot" min="-45" max="45" value="0"><span class="val" id="rotv">0°</span></div></div>
  </div>

  <div class="panel" id="p-rahmen">
    <div class="row"><label>Rahmen</label>
      <div class="boxes" id="bx">
        <button class="box on" data-b=""><i style="border:2px dashed #999;border-radius:4px"></i>Keiner</button>
        <button class="box" data-b="line"><i style="border:2px solid #111;border-radius:2px"></i>Linie</button>
        <button class="box" data-b="round"><i style="border:2px solid #111;border-radius:8px"></i>Rund</button>
        <button class="box" data-b="merk"><i style="border-left:6px solid #111;background:#ffe9a8;border-radius:3px"></i>Merkkasten</button>
      </div></div>
    <div class="row"><label>Rahmenfarbe</label><div class="swatches" id="bc"></div></div>
  </div>

  <div class="footer">
    <label class="remember"><input type="checkbox" checked> Für nächsten Text merken</label>
    <button class="ghost">Abbrechen</button>
    <button class="save">Fertig</button>
  </div>
</div>
</div>

<script>
const S={font:'normal',kind:'body',bold:false,size:26,ul:'',color:'#111111',hl:'',al:'left',list:'',lh:1.3,rot:0,box:'',bc:'#111111'};
const KIND={h1:40,h2:32,body:26,note:16};
const FONTS={normal:'Inter',cursive:"'Dancing Script'",hand:'Caveat'};
const COLORS=['#111111','#1F5FD1','#D62B2B','#1E8A3E','#8A2BD6','#E07A00','#6B6B6B'];
const HL=['','#FFE45C','#B8F2A0','#7AD7F0','#FFB3C7','#E0B3FF'];
const PRESETS=[
 {n:'Überschrift',s:'Groß · fett · Linie',v:{kind:'h1',size:40,bold:true,ul:'single',box:'',hl:'',color:'#111111',list:''}},
 {n:'Definition',s:'Blau · Rahmen',v:{kind:'body',size:24,bold:false,ul:'',box:'round',bc:'#1F5FD1',color:'#1F5FD1',hl:'',list:''}},
 {n:'Merksatz',s:'Merkkasten · gelb',v:{kind:'body',size:24,bold:true,ul:'',box:'merk',bc:'#111111',color:'#111111',hl:'',list:''}},
 {n:'Beispiel',s:'Grün · Liste',v:{kind:'body',size:22,bold:false,ul:'',box:'',color:'#1E8A3E',hl:'',list:'•'}},
 {n:'Wichtig!',s:'Rot · markiert',v:{kind:'body',size:26,bold:true,ul:'wavy',box:'',color:'#D62B2B',hl:'#FFE45C',list:''}},
 {n:'Mein Bio-Stil',s:'Eigene Vorlage',v:{kind:'h2',size:30,bold:true,ul:'dbl',box:'line',bc:'#8A2BD6',color:'#8A2BD6',hl:'#E0B3FF',list:'',font:'hand'}},
];
const SYMS=['→','⇒','⇔','≈','≠','≤','≥','±','·','²','³','½','√','π','Δ','∞','α','β','γ','λ','°','€','✓','✗','★','!','?','„“'];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const txt=$('#txt');

function esc(t){return t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(){
  const pv=$('#pv'); const lines=txt.value.split('\n');
  let html;
  if(S.list){ html=lines.map((l,i)=>{const m=S.list==='1.'?(i+1)+'.':S.list==='a)'?String.fromCharCode(97+i)+')':S.list;return `<div style="display:flex;gap:.5em"><span style="flex:0 0 auto">${m}</span><span>${esc(l)}</span></div>`}).join(''); }
  else html=lines.map(l=>`<div>${esc(l)||'&nbsp;'}</div>`).join('');
  pv.innerHTML=`<span class="${S.ul}" style="display:block">${html}</span>`;
  Object.assign(pv.style,{fontFamily:FONTS[S.font],fontSize:(S.font==='hand'?S.size*1.2:S.size)+'px',fontWeight:S.bold?800:400,color:S.color,
    textAlign:S.al,lineHeight:S.lh,transform:`rotate(${S.rot}deg)`,background:S.hl?S.hl:(S.box==='merk'?'#FFE9A8':'transparent'),
    border:S.box==='line'||S.box==='round'?`3px solid ${S.bc}`:'0',borderLeft:S.box==='merk'?`8px solid ${S.bc}`:(S.box?`3px solid ${S.bc}`:'0'),
    borderRadius:S.box==='round'?'16px':S.box==='line'?'2px':'8px',padding:S.box?'10px 16px':'4px 8px'});
  $('#sizev').textContent=S.size; $('#size').value=S.size;
  $('#lhv').textContent=S.lh.toFixed(1).replace('.',','); $('#rotv').textContent=S.rot+'°';
  $('#dial').style.setProperty('--r',S.rot+'deg');
  syncUI();
}
function syncUI(){
  $$('.font').forEach(b=>b.classList.toggle('on',b.dataset.f===S.font));
  $$('#kind button').forEach(b=>b.classList.toggle('on',b.dataset.k===S.kind));
  $('#bold').classList.toggle('on',S.bold);
  $$('#ul button').forEach(b=>b.classList.toggle('on',b.dataset.u===S.ul));
  $$('#al button').forEach(b=>b.classList.toggle('on',b.dataset.a===S.al));
  $$('#li button').forEach(b=>b.classList.toggle('on',b.dataset.l===S.list));
  $$('#bx .box').forEach(b=>b.classList.toggle('on',b.dataset.b===S.box));
  $$('#tc .sw').forEach(b=>b.classList.toggle('on',b.dataset.c===S.color));
  $$('#hl .sw').forEach(b=>b.classList.toggle('on',b.dataset.c===S.hl));
  $$('#bc .sw').forEach(b=>b.classList.toggle('on',b.dataset.c===S.bc));
}
function swatches(el,list,key){
  el.innerHTML=list.map(c=>`<button class="sw ${c?'':'none'}" data-c="${c}" style="${c?'background:'+c:''}" title="${c||'Kein'}"></button>`).join('')+'<button class="sw more" title="Eigene Farbe …"></button>';
  el.onclick=e=>{const b=e.target.closest('.sw');if(!b||b.classList.contains('more'))return;S[key]=b.dataset.c;render()};
}
swatches($('#tc'),COLORS,'color'); swatches($('#hl'),HL,'hl'); swatches($('#bc'),COLORS,'bc');
$('#sym').innerHTML=SYMS.map(s=>`<button>${s}</button>`).join('');
$('#sym').onclick=e=>{const b=e.target.closest('button');if(!b)return;const p=txt.selectionStart;txt.value=txt.value.slice(0,p)+b.textContent+txt.value.slice(txt.selectionEnd);txt.focus();txt.selectionStart=txt.selectionEnd=p+b.textContent.length;render()};
$('#presets').innerHTML=PRESETS.map((p,i)=>{const v=p.v;const st=`font-family:${FONTS[v.font||'normal']};font-weight:${v.bold?800:400};color:${v.color};font-size:${v.kind==='h1'?20:16}px;${v.hl?'background:'+v.hl+';':''}${v.box==='merk'?'background:#FFE9A8;border-left:5px solid '+v.bc+';padding-left:4px;':v.box?'border:2px solid '+v.bc+';border-radius:'+(v.box==='round'?'8px':'2px')+';padding:0 4px;':''}`;
  return `<button class="preset" data-i="${i}"><span style="${st}" class="${v.ul}">${v.list?v.list+' ':''}${p.n}</span><span class="s">${p.s}</span></button>`}).join('')+'<button class="preset add"><b>+</b>Als Vorlage<br>speichern</button>';
$('#presets').onclick=e=>{const b=e.target.closest('.preset');if(!b||b.classList.contains('add'))return;
  $$('.preset').forEach(x=>x.classList.remove('on'));b.classList.add('on');Object.assign(S,{font:'normal'},PRESETS[b.dataset.i].v);render()};
$$('.tab').forEach(t=>t.onclick=()=>{$$('.tab').forEach(x=>x.classList.toggle('on',x===t));$$('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+t.dataset.t))});
$$('.font').forEach(b=>b.onclick=()=>{S.font=b.dataset.f;render()});
$$('#kind button').forEach(b=>b.onclick=()=>{S.kind=b.dataset.k;S.size=KIND[S.kind];S.bold=S.kind==='h1'||S.kind==='h2'?true:S.bold;render()});
$('#bold').onclick=()=>{S.bold=!S.bold;render()};
$$('#ul button').forEach(b=>b.onclick=()=>{S.ul=b.dataset.u;render()});
$$('#al button').forEach(b=>b.onclick=()=>{S.al=b.dataset.a;render()});
$$('#li button').forEach(b=>b.onclick=()=>{S.list=b.dataset.l;render()});
$$('#bx .box').forEach(b=>b.onclick=()=>{S.box=b.dataset.b;render()});
$('#size').oninput=e=>{S.size=+e.target.value;render()};
$('#lh').oninput=e=>{S.lh=e.target.value/10;render()};
$('#rot').oninput=e=>{S.rot=+e.target.value;render()};
txt.oninput=render;
render();
</script>
</body>
</html>
